name: Refill Buffer Instagram Queue

on:
  schedule:
    # 08:20 Asia/Bangkok (UTC+7), after the 08:00 Auto Publish slot
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buffer-instagram-queue-refill
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare Python image renderer
        run: |
          python3 -m venv "$RUNNER_TEMP/buffer-venv"
          echo "$RUNNER_TEMP/buffer-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/buffer-venv/bin/python" -m pip install Pillow==11.3.0
      - name: Refill @aiboxtoken Instagram queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/buffer-instagram-queue-refill.mjs
